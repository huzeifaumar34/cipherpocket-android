name: Prepare Android toolchain
description: Install the pinned Android toolchain and cache static OpenSSL builds for all supported ABIs.

inputs:
  ndk-version:
    description: Android NDK version pinned by PROJECT.md
    required: false
    default: 28.2.13676358

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install pinned Android SDK packages
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        yes | sdkmanager --licenses >/dev/null
        sdkmanager \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;${NDK_VERSION}" \
          "cmake;3.22.1"

    - name: Cache OpenSSL static libraries
      id: openssl-cache
      uses: actions/cache@v6
      with:
        path: third_party/openssl/build
        key: openssl-${{ runner.os }}-${{ runner.arch }}-ndk-${{ inputs.ndk-version }}-${{ hashFiles('scripts/build_openssl_android.sh', 'third_party/openssl/VERSION', 'third_party/openssl/SHA256') }}

    - name: Build OpenSSL for Android ABIs
      if: steps.openssl-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ANDROID_NDK_VERSION: ${{ inputs.ndk-version }}
        JOBS: "2"
      run: ./scripts/build_openssl_android.sh
